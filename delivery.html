<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAS BAZAR - Delivery Partner Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-card { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-orange-500 selection:text-slate-950">

    <!-- Top Header -->
    <header class="w-full p-4 flex items-center justify-between border-b border-slate-800/80 bg-slate-900/50 backdrop-blur-md sticky top-0 z-50">
        <div class="flex items-center space-x-3">
            <a href="index.html" class="w-9 h-9 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-center text-slate-300 font-bold hover:bg-slate-700 transition-colors">←</a>
            <div>
                <h1 class="text-sm font-extrabold tracking-tight text-white">DELIVERY CONSOLE</h1>
                <p class="text-[10px] text-emerald-400 font-bold uppercase tracking-wider">● Rider Online</p>
            </div>
        </div>
        <div class="px-3 py-1 rounded-full text-[10px] font-extrabold uppercase tracking-widest bg-emerald-500/10 text-emerald-400 border border-emerald-500/30">
            Active Shift
        </div>
    </header>

    <!-- Main Delivery Content -->
    <main class="flex-1 w-full max-w-md mx-auto px-4 py-6 space-y-6">
        
        <!-- Rider Stats -->
        <div class="grid grid-cols-2 gap-3">
            <div class="glass-card p-4 rounded-2xl border-l-4 border-l-emerald-500">
                <p class="text-[11px] text-slate-400 font-bold uppercase">Delivered Today</p>
                <h3 class="text-2xl font-black text-white mt-1">8</h3>
            </div>
            <div class="glass-card p-4 rounded-2xl border-l-4 border-l-orange-500">
                <p class="text-[11px] text-slate-400 font-bold uppercase">Earnings</p>
                <h3 class="text-2xl font-black text-emerald-400 mt-1">₹320</h3>
            </div>
        </div>

        <!-- Assigned Deliveries Section -->
        <div class="space-y-3">
            <div class="flex items-center justify-between">
                <h2 class="text-xs font-black uppercase tracking-widest text-slate-400">Assigned Dispatches</h2>
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
            </div>

            <!-- Dispatch Card Example -->
            <div class="glass-card p-4 rounded-3xl space-y-3 border border-emerald-500/30">
                <div class="flex items-center justify-between border-b border-slate-800 pb-2">
                    <div>
                        <span class="text-xs font-black text-emerald-400">Order #104</span>
                        <p class="text-xs text-slate-300 font-medium">Rahul Das • ₹120 (COD)</p>
                    </div>
                    <span class="px-2.5 py-1 rounded-full text-[10px] font-bold bg-emerald-500/10 text-emerald-400 border border-emerald-500/30">Ready for Pickup</span>
                </div>

                <div class="text-xs space-y-1.5 text-slate-300">
                    <p><strong>🏪 Pickup:</strong> RAS BAZAR Central Store, Main Road</p>
                    <p><strong>📍 Drop:</strong> Near Ward No. 4, Local Colony</p>
                </div>

                <div class="pt-2 border-t border-slate-800 flex space-x-2">
                    <button onclick="alert('Opening GPS Navigation...')" class="flex-1 py-2.5 rounded-xl text-xs font-bold bg-slate-900 text-slate-300 border border-slate-700 hover:bg-slate-800 transition-all">🗺️ Navigate</button>
                    <button onclick="alert('Order marked as Delivered successfully!')" class="flex-1 py-2.5 rounded-xl text-xs font-extrabold bg-emerald-500 text-slate-950 hover:bg-emerald-400 transition-all shadow-lg shadow-emerald-500/25">Mark Delivered ✓</button>
                </div>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="w-full py-4 px-4 text-center border-t border-slate-900 bg-slate-950">
        <p class="text-[11px] text-slate-500 font-medium">RAS BAZAR Fleet Manager v1.0</p>
    </footer>

</body>
</html>
